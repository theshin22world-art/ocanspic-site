<style>
:root{--navy:#0e304a;--orange:#fd7548;--paper:#f5f7fa;--card:#fff;--ink:#0f1a26;--ink2:#3d4a5c;--mute:#6b7787;--line:#dde2eb;--ok:#0f9d6a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.65}
.nav{background:var(--navy);color:#fff;padding:14px 16px}.nav .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;font-weight:900}.nav a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px}.nav img{width:30px;height:30px;border-radius:8px}.nav small{margin-left:auto;font-weight:400;opacity:.6;font-size:12.5px}
main{max-width:760px;margin:0 auto;padding:36px 16px 80px}
.k{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--orange);font-weight:600}
h1{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:6px 0 6px}.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}
.plan{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.plan b{font-size:18px}.plan .price{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600}.plan .price small{font-size:13px;color:var(--mute);font-family:inherit;font-weight:400}
ul.chk{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;color:var(--ink2);font-size:14px}ul.chk li::before{content:'✓';color:var(--orange);font-weight:900;margin-right:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;font-size:15px}
.btn.big{width:100%;padding:16px;font-size:17px;background:var(--orange)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}
.lg{display:grid;gap:10px;max-width:420px;margin:0 auto}.lgb{display:flex;align-items:center;justify-content:center;height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;font:inherit;font-size:15px}
.lgb.naver{background:#03C75A;color:#fff;border-color:#03C75A}.lgb.apple{background:#000;color:#fff;border-color:#000}.lgb.email{border-style:dashed;color:var(--mute)}
.row{display:flex;gap:8px}.row input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px}
.me{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink2);font-size:14px;flex-wrap:wrap}.me b{color:var(--ink)}
.note{background:#fff4ef;border-left:3px solid var(--orange);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.5px;color:#6b3a22;margin-top:14px}
.ok{color:var(--ok)}.err{color:#c0392b}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:12.5px;line-height:1.9}footer a{color:var(--mute)}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* 공용: Supabase 로그인 */
window.OC=(function(){
  var C=window.OCAN_CONFIG||{}; var sb=(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{flowType:'pkce',persistSession:true}}):null;
  var here=location.origin+location.pathname;
  function loginHTML(){ return '<div class="lg">'
    +(C.NAVER_LOGIN?'<button class="lgb naver" data-p="naver">네이버로 로그인</button>':'')
    +'<button class="lgb" data-p="google">Google로 로그인</button><button class="lgb apple" data-p="apple">Apple로 로그인</button>'
    +'<button class="lgb email" data-p="email">이메일로 가입 또는 로그인</button>'
    +'<div class="row" id="emBox" style="display:none"><input id="emIn" type="email" placeholder="이메일 주소"><button class="btn" id="emGo">계속</button></div>'
    +'<p class="sub" style="text-align:center;font-size:12.5px;margin:6px 0 0">앱에서 쓰는 계정과 같은 계정으로 로그인하세요. 이용권은 이 계정에 붙습니다.</p></div>'; }
  function wire(el){
    var code=false,email='';
    el.querySelectorAll('[data-p]').forEach(function(b){ b.onclick=function(){ var p=b.dataset.p;
      if(p==='email'){ var x=el.querySelector('#emBox'); x.style.display=x.style.display==='none'?'flex':'none'; return; }
      if(p==='naver'){ location.href=C.SUPABASE_URL+'/functions/v1/naver-auth?redirect='+encodeURIComponent(here); return; }
      sb.auth.signInWithOAuth({provider:p,options:{redirectTo:here}}); }; });
    var go=el.querySelector('#emGo'), inp=el.querySelector('#emIn');
    function submit(){ var v=inp.value.trim();
      if(code){ if(!/^\d{6}$/.test(v)) return; go.disabled=true; sb.auth.verifyOtp({email:email,token:v,type:'email'}).then(function(r){ go.disabled=false; if(r.error){ alert('코드가 맞지 않습니다: '+r.error.message); return; } location.reload(); }); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return; go.disabled=true;
      sb.auth.signInWithOtp({email:v,options:{shouldCreateUser:true}}).then(function(r){ go.disabled=false; if(r.error){ alert(r.error.message); return; } email=v; code=true; inp.value=''; inp.type='text'; inp.placeholder='메일로 받은 6자리 코드'; go.textContent='확인'; inp.focus(); }); }
    go.onclick=submit; inp.onkeydown=function(e){ if(e.key==='Enter') submit(); };
  }
  /* 네이버 콜백(token_hash) */
  var q=new URLSearchParams(location.search);
  var ready=Promise.resolve();
  if(sb&&q.get('token_hash')) ready=sb.auth.verifyOtp({token_hash:q.get('token_hash'),type:q.get('type')||'magiclink'}).then(function(){ history.replaceState(null,'',location.pathname); });
  return { sb:sb, C:C, loginHTML:loginHTML, wire:wire, ready:ready,
    user:function(){ return ready.then(function(){ return sb?sb.auth.getSession().then(function(r){ return r.data.session&&r.data.session.user||null; }):null; }); },
    token:function(){ return sb.auth.getSession().then(function(r){ return r.data.session&&r.data.session.access_token; }); },
    signOut:function(){ return sb.auth.signOut().then(function(){ location.reload(); }); } };
})();
</script>

<div class="k">PAYMENT</div>
<h1 id="h">결제를 확인하고 있습니다…</h1>
<p class="sub" id="p">잠시만요.</p>
<div class="card" id="box"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search), pk=q.get('paymentKey'), oid=q.get('orderId'), amt=q.get('amount');
  var H=document.getElementById('h'),Pp=document.getElementById('p'),B=document.getElementById('box');
  if(!OC.sb){ H.textContent='설정이 비어 있습니다'; return; }
  OC.token().then(function(tk){
    if(!tk){ H.textContent='로그인이 풀렸습니다'; Pp.textContent='결제한 계정으로 다시 로그인하면 승인을 마무리합니다.'; B.innerHTML=OC.loginHTML(); OC.wire(B); return; }
    return fetch(OC.C.SUPABASE_URL+'/functions/v1/toss-confirm',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+tk,'apikey':OC.C.SUPABASE_ANON_KEY},body:JSON.stringify({paymentKey:pk,orderId:oid,amount:Number(amt)})})
      .then(function(r){ return r.json(); }).then(function(d){
        if(d.error){ H.innerHTML='<span class="err">승인에 실패했습니다</span>'; Pp.textContent=d.error; B.innerHTML='<a class="btn" href="buy">다시 시도</a> <a class="btn ghost" href="mailto:wichonl@vibivi.co.kr?subject=결제 문의 '+oid+'">문의하기</a>'; return; }
        if(d.waiting){ var va=d.virtualAccount||{}; H.textContent='입금 계좌가 발급되었습니다'; Pp.textContent='입금이 확인되는 즉시 이용권이 열립니다(보통 1~2분).';
          B.innerHTML='<p><b>'+(va.bankCode||'')+' '+(va.accountNumber||'')+'</b><br>예금주 '+(va.customerName||'')+' · 입금 기한 '+(va.dueDate||'').replace('T',' ').slice(0,16)+'</p><p class="sub">입금 후 앱에서 «이미 구매했어요»를 누르세요.</p>'; return; }
        var end=d.license&&d.license.ends_at?new Date(d.license.ends_at):null;
        H.innerHTML='<span class="ok">결제가 완료되었습니다</span>'; Pp.textContent='이용권이 계정에 붙었습니다'+(end?' — '+end.getFullYear()+'년 '+(end.getMonth()+1)+'월 '+end.getDate()+'일까지':'')+'.';
        B.innerHTML='<p>앱으로 돌아가서 <b>설정 → 계정 → 상태 새로고침</b> 또는 잠금 안내의 <b>«이미 구매했어요»</b>를 누르면 모든 기능이 열립니다.</p><p class="sub">아직 설치 전이라면 <a href="./#download">여기서 내려받으세요</a>. 영수증은 토스페이먼츠에서 이메일로 발송됩니다.</p>';
      });
  }).catch(function(e){ H.textContent='오류'; Pp.textContent=String(e); });
})();
</script>
