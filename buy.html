<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 2026-11-27 결제 · 가입 화면은 start 하나로. 예전 주소(/buy, /buy.html: 출시된 앱 76_cloud.js goBuy · 외부 링크)는
   그리지 않고 바로 start 로 옮긴다. 쿼리(plan · ref · utm · from=app …)와 해시(#at=…&rt=… 앱 로그인 넘겨받기)를 그대로 붙인다 */
(function(){var p=location.pathname,t=/\.html$/i.test(p)?p.replace(/buy\.html$/i,'start.html'):p.replace(/buy\/?$/i,'start');if(t===p)t='/start';location.replace(t+location.search+location.hash);})();</script>
<noscript><meta http-equiv="refresh" content="0;url=start"></noscript>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오캔스픽 시작하기</title>
