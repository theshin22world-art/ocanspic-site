<title>결제 미완료 · 오캔스픽</title>

<style>
/* 2026-11-26 지령서 TASK #003·#004 B-3: 결제 취소 · 실패 화면을 결제창(buy)과 같은 모양으로 */
:root{--ink:#20213B;--sub:#5B5E80;--muted:#8B8EAD;--line:#E4E3F0;--olivetext:#688B3E;--font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:#F5F6F9;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;letter-spacing:-.03em;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.frost-gnb{position:sticky;top:0;z-index:40;height:56px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.frost-gnb{background:rgba(255,255,255,.97)}}
.frost-gnb .wrap{max-width:1080px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.wordmark{display:inline-flex;align-items:center;text-decoration:none}
.wordmark .wm-tx{height:15px;width:auto;flex:none}
.gnb-safe{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.gnb-safe svg{width:15px;height:15px;color:var(--olivetext)}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:48px 20px 40px}
.card{background:#FFFFFF;border:none;border-radius:0;box-shadow:0 6px 20px rgba(32,33,59,.06),0 1px 4px rgba(32,33,59,.04);padding:34px 24px 28px;text-align:center}
.ico{width:52px;height:52px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#F5F6F9;color:var(--sub)}
.ico svg{width:26px;height:26px}
h1{margin:0;font-size:22px;font-weight:800;line-height:1.4;letter-spacing:-.04em;color:#20213B;white-space:nowrap}
.sub{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--sub)}
.code{margin:6px 0 0;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 24px;border-radius:999px;font:inherit;font-size:15px;font-weight:700;letter-spacing:-.03em;text-decoration:none;white-space:nowrap;cursor:pointer}
.btn.pri{background:#20213B;color:#FFFFFF;border:1px solid #20213B}
.btn.line{background:#FFFFFF;color:#20213B;border:1px solid var(--line)}
footer{padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
footer i{font-style:normal;margin:0 6px}
@media (max-width:560px){main{padding:32px 16px 32px}.frost-gnb .wrap{padding:0 16px}.card{padding:30px 18px 24px}}
@media (max-width:340px){h1{font-size:20px}.gnb-safe{font-size:12px}}
</style>
</head>
